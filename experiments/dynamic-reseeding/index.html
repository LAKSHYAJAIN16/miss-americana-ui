<!DOCTYPE html>
<html>
<head>
  <title>P2P MP3 Swarm</title>
  <script src="https://cdn.jsdelivr.net/npm/webtorrent/webtorrent.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 2rem; }
    input, button { padding: 0.5rem; margin: 0.3rem; background: #222; color: #eee; border: 1px solid #444; border-radius: 5px; }
    #log { margin-top: 2rem; background: #1a1a1a; padding: 1rem; border-radius: 6px; max-height: 200px; overflow-y: scroll; font-size: 0.9rem; white-space: pre-wrap; }
    audio { display: block; margin-top: 1rem; }
    .magnet-entry { margin: 0.5rem 0; padding: 0.5rem; background: #222; border: 1px solid #444; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>P2P MP3 Swarm</h1>

  <h3>Upload MP3</h3>
  <input type="file" id="fileInput" accept="audio/mpeg">
  <button onclick="uploadMP3()">Seed</button>

  <h3>Download by Magnet Link</h3>
  <input type="text" id="magnetInput" placeholder="Paste magnet URI here" style="width: 60%">
  <button onclick="downloadMP3()">Download</button>

  <div id="log"></div>
  <audio id="audio" controls></audio>

  <script>
    const client = new WebTorrent()
    const ws = new WebSocket('ws://localhost:5002')
    const log = msg => document.getElementById('log').textContent += `\n${msg}`
    const audio = document.getElementById('audio')
    window.localMagnetMap = {}

    ws.onopen = () => log('[WS] Connected to coordinator')
    ws.onmessage = e => {
      const data = JSON.parse(e.data)
      if (data.type === 'seed-request') {
        const entry = localMagnetMap[data.infoHash]
        if (entry) {
          log(`[WS] Reseed request for ${data.infoHash}`)
          client.add(entry.magnetURI, torrent => {
            client.seed(torrent.files[0], () => log('[Client] Reseeding file'))
          })
        }
      }
    }

    function uploadMP3() {
      const file = document.getElementById('fileInput').files[0]
      if (!file) return log('Select a file first')
      client.seed(file, torrent => {
        log(`[Seeder] Seeding ${file.name}`)
        log(`[Magnet] ${torrent.magnetURI}`)
        localMagnetMap[torrent.infoHash] = { magnetURI: torrent.magnetURI }
        ws.send(JSON.stringify({
          type: 'announce',
          infoHash: torrent.infoHash,
          magnetURI: torrent.magnetURI
        }))
      })
    }

    function downloadMP3() {
      const uri = document.getElementById('magnetInput').value.trim()
      if (!uri) return log('Enter a magnet link')
      client.add(uri, torrent => {
        log(`[Download] Downloading: ${torrent.name}`)
        ws.send(JSON.stringify({
          type: 'announce',
          infoHash: torrent.infoHash,
          magnetURI: torrent.magnetURI
        }))
        localMagnetMap[torrent.infoHash] = { magnetURI: torrent.magnetURI }
        torrent.files[0].getBlob((err, blob) => {
          if (err) return log('Error loading file')
          const url = URL.createObjectURL(blob)
          audio.src = url
          audio.play()
        })
      })
    }
  </script>
</body>
</html>
